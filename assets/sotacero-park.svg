<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sotacero Park — laboratorio de ciberseguridad</title>
  <desc id="desc">Cabecera verde oscuro con acentos ámbar y un plano geométrico del perímetro. Seguridad por diseño. Curiosidad por naturaleza.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1715"/>
      <stop offset="1" stop-color="#132D24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#70B096" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="278" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <path d="M3 35V245" stroke="#E3A65D" stroke-width="6"/>
    <path d="M815 0V280" stroke="#48745F" stroke-opacity=".35"/>
    <rect x="56" y="38" width="7" height="7" rx="1" fill="#E3A65D"/>
    <text x="77" y="48" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="500" letter-spacing="1.5" fill="#A9C7B8">CIBERSEGURIDAD / INVESTIGACIÓN / AUTOMATIZACIÓN</text>
    <text x="54" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="65" font-weight="750" letter-spacing="1" fill="#EDF4EE">SOTACERO <tspan fill="#8DCCAA">PARK</tspan></text>
    <text x="57" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#B8CDBF">Seguridad por diseño. Curiosidad por naturaleza.</text>
    <path d="M57 226H768" stroke="#39644E" stroke-opacity=".8"/>
    <text x="57" y="251" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="11" letter-spacing="1.7" fill="#86AB95">LABORATORIO PERSONAL</text>
    <text x="768" y="251" text-anchor="end" font-family="ui-monospace, 'DejaVu Sans Mono', Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#E3A65D">@SOTACERO</text>
