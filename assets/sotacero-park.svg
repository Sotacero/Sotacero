      <path d="M-128 0H128M0 -107V107" stroke="#78B48F" stroke-opacity=".12"/>
      <path d="M-81 -48L-24 -78L58 -61L89 -3L61 61L-18 80L-82 35Z" stroke="#80B695" stroke-width="2"/>
      <path d="M-67 -40L-21 -65L48 -50L74 -3L50 50L-16 66L-68 28Z" stroke="#548666" stroke-dasharray="4 7"/>
      <path d="M-81 -48L-31 -15L28 -26L61 61M-31 -15L-18 80" stroke="#69997B" stroke-opacity=".6"/>
      <circle cx="-81" cy="-48" r="5" fill="#E3A65D"/>
      <circle cx="61" cy="61" r="5" fill="#E3A65D"/>
      <circle cx="-18" cy="80" r="4" fill="#90CBA6"/>
      <rect x="-46" y="-25" width="92" height="52" rx="6" fill="#142E24" stroke="#588E6C"/>
